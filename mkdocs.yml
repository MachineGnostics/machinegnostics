site_name: Machine Gnostics
site_url: https://docs.machinegnostics.com
site_description: A python library for machine learning and data science based on non-statistical methods.
site_author: Nirmal Parmar
copyright: 
  Copyright © 2026 Nirmal Parmar (Machine Gnostics) |  
  <a href="https://github.com/MachineGnostics/machinegnostics/blob/main/LICENSE"> GNU v3.0 License  |</a>   
  <a href="#__consent">Change cookie settings   |</a>
  <a href="https://docs.machinegnostics.com/latest/contact/">Contact us</a>

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  palette:
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light modee
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.footer
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs.sticky
    - content.code.annotate
    - content.code.copy
    - content.code.select
    # - announce.dismiss
  custom_dir: overrides
  language: en

plugins:
  - privacy
  - search
  # - search.suggest
  # - search.highlight
  # - search.share
  - mike
  - git-revision-date-localized
  - awesome-pages

repo_url: https://github.com/MachineGnostics/machinegnostics
repo_name: Machine Gnostics

nav:
  - Home: https://machinegnostics.com/
  - Introduction: 
    - Welcome: index.md
    - History: stories/history.md
    - Learn: 
        - Concept: mg/concepts.md
        - Principles: mg/principles.md
        - Distributions Functions: mg/gdf.md
        - Architecture: mg/architecture.md
        - Glossary: mg/mg_arguments.md
  - Installation: 
    - Installation: installation.md
    - Quick Start: tutorials/overview.md
    - Tutorials Library: tutorials/tutorials.md
  - Tutorials:
    - Quick Start: tutorials/overview.md
    - Tutorials Library: tutorials/tutorials.md
  # data analysis vertical
  - Data Analysis:
    - Overview: da/da_models.md
    - Distributions Functions:
      - EGDF: da/egdf.md
      - ELDF: da/eldf.md
      - QGDF: da/qgdf.md
      - QLDF: da/qldf.md
    - Data Analysis:
      - Cluster Analysis: da/cluster_analysis.md
      - Interval Analysis: da/interval_analysis.md
      - Data Homogeneity: da/homogeneity.md
      - Data Scedasticity: da/scedasticity.md
      - Data Membership: da/membership.md
      - Data Interval: da/data_interval.md
      - Data Cluster: da/data_cluster.md
      # - Z0 Estimator: da/z0_estimator.md # moved to non-public class
    - Datasets:
      - Animal Data: datasets/animal_data.md
      - Anscombe Quartet: datasets/anscombe_data.md
      - Classification Data: datasets/cls_data.md
      - Forbes Data: datasets/forbes_data.md
      - Linnerud Data: datasets/linnerud_data.md
      - Longley Data: datasets/longley_data.md
      - MtCars Data: datasets/mtcars_data.md
      - Moon Data: datasets/moon_data.md
      - Puromycin Data: datasets/puromycin_data.md
      - Regression Data: datasets/reg_data.md
      - Stackloss Data: datasets/stackloss_data.md
      - Starwars Data: datasets/starwars_data.md
  # machine learning vertical
  - Machine Learning:
    - Overview: models/ml_models.md
    - Regressors:
      - Linear Regressor: models/reg/lin_reg.md
      - Polynomial Regressor: models/reg/poly_reg.md
      - Logistic Regressor: models/cls/log_reg.md
      - Decision Tree Regressor: models/cart/dt_reg.md
      - Random Forest Regressor: models/cart/rf_reg.md
      - Gnostic Boosting Regressor: models/cart/gb_reg.md
    - Classifiers: 
      - Multi Class Classifier: models/cls/multi_class.md
      - Decision Tree Classifier: models/cart/dt_cls.md
      - Random Forest Classifier: models/cart/rf_cls.md
      - Gnostic Boosting Classifier: models/cart/gb_cls.md
    - Clustering:
      - KMeans Clustering: models/cluster/kmeans.md
      - Estimating Local Clustering: models/cluster/glc.md
    - Forecasting:
      - Auto Regressor: models/forc/ar.md
      - ARIMA: models/forc/arima.md
      - SARIMA: models/forc/sarima.md
    - Utils:
      - Cross Validation: models/sup/cross_val.md
      - Train Test Split: models/sup/train_test_split.md
    - Mlflow Integration: 
      - Mlflow Tracking: models/sup/mlflow.md
  # deep learning vertical
  - Deep Learning:
    - Overview: magnet/index.md
    - Activations:
      - Activation Layers: magnet/activations/index.md
      - ReLU: magnet/activations/relu.md
      - Sigmoid: magnet/activations/sigmoid.md
      - Tanh: magnet/activations/tanh.md
      - Softmax: magnet/activations/softmax.md
      - Step: magnet/activations/step.md
      - LeakyReLU: magnet/activations/leakyrelu.md
      - ELU: magnet/activations/elu.md
      - Softplus: magnet/activations/softplus.md
      - Swish: magnet/activations/swish.md
      - Square: magnet/activations/square.md
      - Fi (Gnostic Fidelity): magnet/activations/fi.md
      - Fj (Gnostic Infidelity): magnet/activations/fj.md
      - Hi (Gnostic Relevance): magnet/activations/hi.md
      - Hj (Gnostic Irrelevance): magnet/activations/hj.md
      - Ei (Gnostic Entropy): magnet/activations/ei.md
    - Losses:
      - Loss Functions: magnet/losses.md
      - MSE: magnet/losses/mse.md
      - Binary Cross Entropy: magnet/losses/binary_cross_entropy.md
      - Fidelity Loss: magnet/losses/fidelity_loss.md
      - Infidelity Loss: magnet/losses/infidelity_loss.md
      - Residual Entropy Loss: magnet/losses/residual_entropy_loss.md
      - RSS Loss: magnet/losses/rss_loss.md
      - ISS Loss: magnet/losses/iss_loss.md
      - Information Loss: magnet/losses/information_loss.md
    - Initializers:
      - Weight Initializers: magnet/initializers.md
      - Initializer (Base): magnet/initializers/initializer.md
      - GlorotUniform: magnet/initializers/glorot_uniform.md
      - GlorotNormal: magnet/initializers/glorot_normal.md
      - HeUniform: magnet/initializers/he_uniform.md
      - HeNormal: magnet/initializers/he_normal.md
      - Normal: magnet/initializers/normal.md
      - Uniform: magnet/initializers/uniform.md
      - Ones: magnet/initializers/ones.md
      - Zeros: magnet/initializers/zeros.md
    - Optimizers:
      - Optimization Algorithms: magnet/optimizers.md
      - Optimizer (Base): magnet/optimizers/optimizer.md
      - Adam: magnet/optimizers/adam.md
      - SGD: magnet/optimizers/sgd.md
      - RMSprop: magnet/optimizers/rmsprop.md
      - Adagrad: magnet/optimizers/adagrad.md
    - Models:
      - Model Containers: magnet/models.md
      - Model (Base): magnet/models/model.md
      - Sequential: magnet/models/sequential.md
      - GnosticNeuron: magnet/models/gnostic_neuron.md
    - Layers:
      - Layer Types: magnet/layers.md
      - Dense: magnet/layers/dense.md
      - iDense (Gnostic Estimating): magnet/layers/idense.md
      - jDense (Gnostic Quantifying): magnet/layers/jdense.md
      - BatchNorm: magnet/layers/batchnorm.md
      - GnosticBatchNorm: magnet/layers/gnostic_batchnorm.md
      - Flatten: magnet/layers/flatten.md
      - Layer (Base): magnet/layers/layer.md
    - Core:
      - Core Infrastructure: magnet/core.md
      - Tensor: magnet/core/tensor.md
      - History: magnet/core/history.md
      - Callback: magnet/core/callback.md
      - Early Stopping: magnet/core/early_stopping.md
  - Metrics:
    - Overview: metrics/metrics.md
    - Classical Metrics:
      - Accuracy: metrics/accuracy.md
      - Precision: metrics/precision.md
      - Recall: metrics/recall.md
      - Confusion Matrix: metrics/confusion_matrix.md
      - F1 Score: metrics/f1_score.md
      - R2 Score: metrics/r2.md
      - Classification Report: metrics/classification_report.md
      - Silhouette Score: metrics/silhouette_score.md
    - Gnostic Metrics:
      - Gnostic Mean: metrics/g_mean.md
      - Gnostic Median: metrics/g_median.md
      - Gnostic Std: metrics/g_std.md
      - Gnostic Variance: metrics/g_variance.md
      - Gnostic Mean Absolute Error: metrics/mae.md
      - Gnostic Mean Squared Error: metrics/mse.md
      - Gnostic Root Mean Squared Error: metrics/rmse.md
      - Gnostic R2 Score: metrics/r2_score.md
      - Gnostic Correlation: metrics/g_correlation.md
      - Gnostic Relevance: metrics/g_relevance.md
      - Gnostic DivI: metrics/divI.md
      - Gnostic GMMFE: metrics/gmmfe.md
      - Gnostic Entropy: metrics/entropy.md
      - Gnostic EvalMet: metrics/evalmet.md 
      - Gnostic Stationarity Test: metrics/stationarity_test.md
      - Gnostic Auto-Correlation: metrics/g_auto_corelation.md
      - Gnostic Auto-Covariance: metrics/g_auto_covariance.md
      - Gnostic Cross-Covariance: metrics/g_cross_variance.md
  - References: ref/references.md
  - Contact: contact.md

markdown_extensions:
  - def_list
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.details
  - pymdownx.emoji:
      # emoji_index: !!python/name:materialx.emoji.twemoji
      # emoji_generator: !!python/name:materialx.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # - pymdownx:inlinehilite
  # - pymdownx:snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format 

